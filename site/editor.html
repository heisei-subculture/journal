<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編集室 — 平成サブカル通信</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex,nofollow"></head><body><main class="editor"><a href="index.html">← 通信を読む</a><p class="eyebrow" style="margin-top:25px">EDITOR'S ROOM</p><h1>管理画面</h1><p>1995〜2003年ごろを語る記事を、選んで残す。</p><p class="hint">このMacで保存します。インターネットへの公開は行いません。</p><p id="editor-status" role="status" aria-live="polite"></p><section class="editor-panel">
<h2>記事を探す</h2>
<label for="article-search">キーワード検索</label>
<input type="search" id="article-search" placeholder="作品名・人名・媒体名・URL">
<div class="article-filters">
<label>状態<select id="review-filter"><option value="">すべて</option><option value="pending">確認待ち</option><option value="approved">採用済み</option><option value="rejected">見送り</option></select></label>
<label>ジャンル<select id="article-category"><option value="">すべて</option></select></label>
<label>並び順<select id="article-order"><option value="newest">追加が新しい順</option><option value="oldest">追加が古い順</option></select></label>
</div>
<p id="review-count" role="status" aria-live="polite"></p>
<div id="review-list"></div>
<nav id="article-pager" aria-label="記事一覧のページ"></nav>
</section><section class="editor-panel"><h2 id="form-title">新しいつぶやき</h2><form id="post-form"><label>タイトル<input id="title" required maxlength="140" placeholder="今日の一曲、観た番組、ふと思い出したこと"></label><label>ジャンル<select id="category"><option>雑記</option><option>音楽</option><option>アイドル</option><option>映画・マンガ</option><option>お笑い</option><option>ゲーム</option></select></label><label>あなたの言葉<textarea id="comment" maxlength="4000" placeholder="短くても、長くても。ニュースへのコメントは空欄に戻すこともできます。"></textarea></label><button class="primary" type="submit">保存する</button> <button class="secondary" id="new" type="button">新しいつぶやきに戻る</button></form></section><section class="editor-panel" id="thought-panel" hidden><h2>つぶやきを編集</h2><div id="editor-list" class="editor-list"></div></section></main><script>
'use strict';let posts=[],current=null;const $=s=>document.querySelector(s);const status=(s,error=false)=>{$('#editor-status').textContent=s;$('#editor-status').classList.toggle('error',error);};
function select(p){current=p;$('#form-title').textContent=p?(p.type==='news'?'ニュースにコメント':'つぶやきを編集'):'新しいつぶやき';$('#title').value=p?.title||'';$('#category').value=p?.category||'雑記';$('#comment').value=p?.comment||'';$('#title').disabled=p?.type==='news';$('#category').disabled=p?.type==='news';$('#comment').required=p?.type!=='news';}
async function load(){
 const response=await fetch('api/posts',{cache:'no-store'});
 if(!response.ok)throw new Error('編集室はローカルサーバーから開いてください。');
 posts=(await response.json()).posts;
 const list=$('#editor-list');
 list.replaceChildren();
 const thoughts=posts.filter(post=>post.type==='thought');
 $('#thought-panel').hidden=!thoughts.length;
 for(const post of thoughts){
  const row=document.createElement('div');
  row.className='editor-post-row';
  const edit=document.createElement('button');
  edit.type='button';
  edit.textContent=post.title;
  const detail=document.createElement('small');
  detail.textContent=post.created_at.slice(0,10);
  edit.append(detail);
  edit.onclick=()=>{select(post);$('#comment').focus();};
  row.append(edit);
  list.append(row);
 }
}
$('#new').onclick=()=>select(null);$('#post-form').onsubmit=async e=>{e.preventDefault();const submit=e.submitter;submit.disabled=true;try{const r=await fetch('api/posts',{method:'POST',headers:{'Content-Type':'application/json','X-Heisei-Editor':'1'},body:JSON.stringify({id:current?.id,title:$('#title').value,category:$('#category').value,comment:$('#comment').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'保存できませんでした');await Promise.all([load(),refreshReview()]);select(posts.find(p=>p.id===data.id));status('保存しました。通信のページを開き直すと反映されます。');}catch(err){status(err.message,true);}finally{submit.disabled=false;}};
document.addEventListener('DOMContentLoaded',()=>load().then(()=>select(null)).catch(()=>{status('編集室を使うには「起動.command」を開いてください。公開サイトやHTMLの直接表示では保存できません。',true);$('#post-form').querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);}));
</script><script src="review.js"></script></body></html>

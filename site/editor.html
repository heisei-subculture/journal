<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編集室 — 平成サブカル通信</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex,nofollow"></head><body><main class="editor"><a href="index.html">← 通信を読む</a><p class="eyebrow" style="margin-top:25px">EDITOR'S ROOM</p><h1>思ったことを、ひとこと。</h1><p>ニュースにコメントを添えたり、自由につぶやいたり。</p><p class="hint">このMacで保存します。インターネットへの公開は行いません。</p><p id="editor-status" role="status" aria-live="polite"></p><section class="editor-panel"><h2 id="form-title">新しいつぶやき</h2><form id="post-form"><label>タイトル<input id="title" required maxlength="140" placeholder="今日の一曲、観た番組、ふと思い出したこと"></label><label>ジャンル<select id="category"><option>雑記</option><option>音楽</option><option>アイドル</option><option>映画・マンガ</option><option>お笑い</option></select></label><label>あなたの言葉<textarea id="comment" maxlength="4000" placeholder="短くても、長くても。ニュースへのコメントは空欄に戻すこともできます。"></textarea></label><button class="primary" type="submit">保存する</button> <button class="secondary" id="new" type="button">新しいつぶやきに戻る</button></form></section><section class="editor-panel"><h2>投稿を選んで編集</h2><p class="hint">ニュースはコメントを編集できます。AIの要約・出典はそのまま残します。</p><div id="editor-list" class="editor-list"></div></section></main><script>
'use strict';let posts=[],current=null;const $=s=>document.querySelector(s);const status=(s,error=false)=>{$('#editor-status').textContent=s;$('#editor-status').classList.toggle('error',error);};
function select(p){current=p;$('#form-title').textContent=p?(p.type==='news'?'ニュースにコメント':'つぶやきを編集'):'新しいつぶやき';$('#title').value=p?.title||'';$('#category').value=p?.category||'雑記';$('#comment').value=p?.comment||'';$('#title').disabled=p?.type==='news';$('#category').disabled=p?.type==='news';$('#comment').required=p?.type!=='news';}
async function load(){const r=await fetch('api/posts',{cache:'no-store'});if(!r.ok)throw new Error('編集室はローカルサーバーから開いてください。起動方法はREADMEにあります。');const data=await r.json();posts=data.posts;$('#editor-list').replaceChildren();for(const p of posts){const b=document.createElement('button');b.type='button';b.textContent=p.title;const small=document.createElement('small');small.textContent=p.type==='news'?(p.comment?'コメントあり':'コメントを添える'):'つぶやき';b.append(small);b.onclick=()=>{select(p);$('#comment').focus();};$('#editor-list').append(b);}}
$('#new').onclick=()=>select(null);$('#post-form').onsubmit=async e=>{e.preventDefault();const submit=e.submitter;submit.disabled=true;try{const r=await fetch('api/posts',{method:'POST',headers:{'Content-Type':'application/json','X-Heisei-Editor':'1'},body:JSON.stringify({id:current?.id,title:$('#title').value,category:$('#category').value,comment:$('#comment').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'保存できませんでした');await load();select(posts.find(p=>p.id===data.id));status('保存しました。通信のページを開き直すと反映されます。');}catch(err){status(err.message,true);}finally{submit.disabled=false;}};
load().then(()=>select(null)).catch(()=>{status('編集室を使うには「起動.command」を開いてください。公開サイトやHTMLの直接表示では保存できません。',true);$('#post-form').querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);});
</script></body></html>
